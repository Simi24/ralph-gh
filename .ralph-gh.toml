# .ralph-gh.toml — ralph-gh dogfooding: the conductor runs on its own repo.
# Plain data, read with tomllib; see example.ralph-gh.toml for every key.

# Verification: the conductor's unit tests, then a syntax check of the installer.
verify_commands = [
  "python3 -m unittest discover -s tests -t .",
  "bash -n install.sh",
]

branch_prefix = "feat"
base_branch = "main"
gate_fix_rounds = 2
session_timeout = 7200

# Writing sessions on Sonnet; review judgment stays on the Opus-pinned reviewer agents.
model = "claude-sonnet-5"

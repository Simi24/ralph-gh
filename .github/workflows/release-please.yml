name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# The loop's own merges can push to main in quick succession; without this,
# two concurrent runs could both act on the same standing release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (v5.0.0), not a floating tag: this workflow
      # writes releases and tags, so its action supply chain is trusted input.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
